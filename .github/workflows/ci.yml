name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The WASM loader unit test runs scripts/build-wasm.mjs (pin matches native/rust-toolchain.toml).
      - run: rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-unknown
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:docs
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/unit/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: test-results/unit/
          if-no-files-found: warn
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The native bootstrap browser spec builds the wasm32 artifact (pin matches native/rust-toolchain.toml).
      - run: rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-unknown
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          # This run's reports only; committed evidence elsewhere under test-results/ is in the checkout.
          path: |
            test-results/browser/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build with preserved exit status
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-build
          path: |
            apps/web/dist/
            build.log
          if-no-files-found: warn
          retention-days: 14
